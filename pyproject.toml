[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage-os-v2"
version = "0.1.0"
description = "Independent Bybit/BingX USDT perpetual OBSERVE scanner"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "asyncpg>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
arbitrage-scanner = "apps.scanner.main:main"
arbitrage-telegram = "apps.telegram_bot.main:main"

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "apps*", "infrastructure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
