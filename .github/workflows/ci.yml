name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_secrets.py --history
      - run: ruff check .
      - run: pytest --cov=core --cov=adapters --cov=apps --cov=infrastructure --cov-report=term-missing
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arbitrage
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scanner -d arbitrage"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_postgres.py
        env:
          TEST_DATABASE_URL: postgresql://scanner:ci-only@localhost:5432/arbitrage

  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ephemeral container credentials
        run: |
          for key in POSTGRES_PASSWORD CONTROL_TOKEN; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Build, run and verify restart persistence
        run: |
          docker compose up -d --build postgres scanner
          python scripts/compose_smoke.py
      - name: Diagnostics
        if: failure()
        run: docker compose ps
      - name: Cleanup
        if: always()
        run: docker compose down -v
